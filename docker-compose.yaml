name: openai-gemini-api-key-rotator
services:
  openai-gemini-api-key-rotator:
    container_name: openai-gemini-api-key-rotator
    image: rpfilomeno/openai-gemini-api-key-rotator
    ports:
      - "12345:8990"
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
      - TZ=Asia/Manila
    volumes:
      - ./app:/app
    entrypoint: npm start
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
